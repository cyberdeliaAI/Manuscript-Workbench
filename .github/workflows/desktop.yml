# Builds the desktop app (the Python server frozen with PyInstaller, inside Electron) on every platform, because a
# frozen server only runs on the system it was built on. Started by hand, or by a version tag such as v2.0.0.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
          - { target: linux-x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Python packages
        run: python -m pip install -r requirements-build.txt
      - name: System packages for Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Tests of the Electron modules
        if: runner.os != 'Windows'
        run: cd electron && npm ci && npm test
      - name: Build and check the app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_desktop.py
      - name: Build and check the app
        if: runner.os != 'Linux'
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-workbench-${{ matrix.target }}
          path: |
            electron/out/manuscript-workbench-desktop-*.zip
            electron/out/manuscript-workbench-desktop-*.tar.gz
            electron/out/manuscript-workbench-desktop-*.sha256
          if-no-files-found: error
